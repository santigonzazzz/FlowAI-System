# Configuracion de Netlify para el frontend de FlowAI.
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA: cualquier ruta que no sea la API cae en index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─────────────────────────────────────────────────────────────────────────────
# OPCIONAL — Proxy de la API desde Netlify al backend desplegado.
# Si prefieres no usar VITE_API_URL en el build, descomenta estos bloques y
# reemplaza https://TU-BACKEND por tu URL real (p. ej. https://flowai-api.onrender.com).
# Con "force" Netlify enruta SIEMPRE estas rutas al backend aunque exista
# un archivo estatico con el mismo nombre.
# ─────────────────────────────────────────────────────────────────────────────
# [[redirects]]
#   from = "/messages"
#   to = "https://TU-BACKEND/messages"
#   status = 200
#   force = true
#
# [[redirects]]
#   from = "/health"
#   to = "https://TU-BACKEND/health"
#   status = 200
#   force = true
